<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Walls</title>
    <meta name="description" content="Quoridor for two." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f5f5f5'/%3E%3Ccircle cx='12' cy='16' r='5' fill='%231a9b8a'/%3E%3Ccircle cx='20' cy='16' r='5' fill='%23d4566a'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <section id="lobby" class="page lobby">
      <div class="lobby-inner">
        <h1 class="logo">Walls</h1>
        <p class="logo-sub">Quoridor for two</p>

        <div class="lobby-actions">
          <button type="button" class="primary" id="btnCreate">New room</button>
          <div class="join-row">
            <input
              id="joinCode"
              type="text"
              maxlength="8"
              placeholder="Room code"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" class="secondary" id="btnJoin">Join</button>
          </div>
          <button type="button" class="textish" id="btnLocal">Play on this device</button>
        </div>
        <p class="lobby-err" id="lobbyErr" hidden></p>
      </div>
    </section>

    <section id="gameView" class="page game" hidden>
      <header class="bar">
        <button type="button" class="textish" id="btnLeave">Leave</button>
        <span class="room-meta" id="roomMeta"></span>
        <button type="button" class="textish" id="btnCopy" hidden>Copy link</button>
      </header>

      <p class="status" id="status"></p>

      <div class="stage">
        <div class="side" id="side0">
          <span class="dot a"></span>
          <span class="side-name">Teal</span>
          <span class="side-walls" id="walls0">10</span>
        </div>

        <div class="board-frame">
          <div id="board" class="board" role="grid" aria-label="Board"></div>
        </div>

        <div class="side" id="side1">
          <span class="dot b"></span>
          <span class="side-name">Rose</span>
          <span class="side-walls" id="walls1">10</span>
        </div>
      </div>

      <div class="controls">
        <button type="button" class="btn-quiet" id="btnUndo">Undo</button>
        <button type="button" class="btn-quiet" id="btnNew">Reset</button>
      </div>
    </section>

    <div id="winModal" class="modal" hidden>
      <div class="modal-card">
        <p id="winText">Teal wins</p>
        <button type="button" class="primary" id="btnPlayAgain">Play again</button>
      </div>
    </div>

    <script type="module" src="./app.js?v=7"></script>
  </body>
</html>
