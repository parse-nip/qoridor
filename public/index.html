<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walls — Quoridor</title>
    <meta
      name="description"
      content="Quoridor — neon noir board game. Race to the opposite wall."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0b0d'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%232ee6c5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <h1>WALLS</h1>
      </div>
      <p class="tagline">Quoridor · first to the far line wins</p>
    </header>

    <main class="layout">
      <aside class="panel panel-p0" data-player="0">
        <div class="panel-glow"></div>
        <div class="player-label">Cyan</div>
        <div class="wall-count">
          <span class="wall-pips" id="pips0"></span>
          <span class="wall-num" id="walls0">10</span>
        </div>
        <div class="turn-chip" id="turn0">Your turn</div>
      </aside>

      <section class="board-wrap">
        <div class="board-stage">
          <div id="board" class="board" role="grid" aria-label="Quoridor board"></div>
          <div id="overlay" class="overlay" aria-hidden="true"></div>
        </div>
        <div class="hint" id="hint">
          Move your pawn, or place a wall. Drag across a gutter to aim a wall —
          click to drop. Press <kbd>R</kbd> to rotate.
        </div>
      </section>

      <aside class="panel panel-p1" data-player="1">
        <div class="panel-glow"></div>
        <div class="player-label">Pink</div>
        <div class="wall-count">
          <span class="wall-pips" id="pips1"></span>
          <span class="wall-num" id="walls1">10</span>
        </div>
        <div class="turn-chip" id="turn1">Waiting</div>
      </aside>
    </main>

    <footer class="toolbar">
      <button type="button" class="btn" id="btnModeMove" data-active="true">
        Move
      </button>
      <button type="button" class="btn" id="btnModeWall">Wall</button>
      <button type="button" class="btn ghost" id="btnRotate" title="Rotate wall (R)">
        Rotate
      </button>
      <button type="button" class="btn ghost" id="btnUndo">Undo</button>
      <button type="button" class="btn ghost" id="btnNew">New game</button>
    </footer>

    <div id="winModal" class="modal" hidden>
      <div class="modal-card">
        <p class="modal-eyebrow">Game over</p>
        <h2 id="winText">Cyan wins</h2>
        <button type="button" class="btn" id="btnPlayAgain">Play again</button>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
